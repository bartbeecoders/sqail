name: ci

# Checks for sqail and sqail-service. release.yml calls this workflow before
# it builds packages. The portal and the frozen sqail-legacy/ app are not
# built here.
on:
  push:
    branches: [main]
    paths-ignore:
      - "sqail-legacy/**"
      - "sqail.portal/**"
      - "k8s/**"
      - "marketing/**"
      - "Vibecoding/**"
      - "**.md"
      - ".github/workflows/portal.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "sqail-legacy/**"
      - "sqail.portal/**"
      - "k8s/**"
      - "marketing/**"
      - "Vibecoding/**"
      - "**.md"
      - ".github/workflows/portal.yml"
      - ".github/workflows/release.yml"
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan for the headless UI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test --workspace
      - name: Tests (without the GPU-rendered UI suite)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude sqail-ui
      - name: UI tests (WARP adapter; informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p sqail-ui

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo audit

  integration:
    # Postgres + SQL Server in podman (preinstalled on the Ubuntu runners),
    # seeded by the same script developers use.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers sqlite3
      - run: ./scripts/db.sh up
      - run: SQAIL_IT=1 cargo test --workspace -- --ignored
      - run: ./scripts/smoke.sh
      - name: Container logs on failure
        if: failure()
        run: podman logs sqail-mssql | tail -50; podman logs sqail-postgres | tail -50

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --profile fuzz -p sqail-fuzz -- 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-crash-*.txt
