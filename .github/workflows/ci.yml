name: ci

# Checks for sqail and sqail-service. release.yml calls this workflow before
# it builds packages. The portal and the frozen sqail-legacy/ app are not
# built here.
on:
  push:
    branches: [main]
    paths-ignore:
      - "sqail-legacy/**"
      - "sqail.portal/**"
      - "k8s/**"
      - "marketing/**"
      - "Vibecoding/**"
      - "**.md"
      - ".github/workflows/portal.yml"
      - ".github/workflows/release.yml"
  # Every pull request runs the checks: main requires them before merging,
  # and a PR that skipped them could never merge.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going for the
# old one. Pushes to main and release runs (workflow_call) always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Software Vulkan for the headless UI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      - name: Tests (without the GPU-rendered UI suite)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude sqail-ui --locked
      - name: UI tests (WARP adapter; informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p sqail-ui --locked

  msrv:
    # rust-version in Cargo.toml; keep the two in step.
    name: msrv (1.95)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo audit

  integration:
    # Postgres + SQL Server in podman (preinstalled on the Ubuntu runners),
    # seeded by the same script developers use.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers sqlite3
      - run: ./scripts/db.sh up
      - run: SQAIL_IT=1 cargo test --workspace --locked -- --ignored
      - run: ./scripts/smoke.sh
      - name: Container logs on failure
        if: failure()
        run: podman logs sqail-mssql | tail -50; podman logs sqail-postgres | tail -50

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --profile fuzz -p sqail-fuzz --locked -- 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-crash-*.txt
