name: nightly

# Every night, if main changed since the last nightly:
#   ci.yml full suite (Windows, MSRV, integration, fuzz) → Linux tarball +
#   Windows zip → SBOMs, SHA256SUMS and build provenance attestations →
#   the rolling `nightly` GitHub prerelease (replaced each time)
#   and /opt/sqail-releases/nightly on the download server (+ nightly.json).
# Stable versions still come from v* tags (release.yml); the portal's
# current.json is never touched here. Pull requests only get the fast checks,
# so a nightly that fails is the first sign of a Windows, integration or fuzz
# regression: fix it on main and the next night publishes again.
#
# "Run workflow" builds now, even if main hasn't changed.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.c.outputs.build }}
      previous: ${{ steps.c.outputs.previous }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::nightlies are built from main, not $GITHUB_REF"
            exit 1
          fi
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$PREVIOUS" == "$GITHUB_SHA" ]]; then
            echo "main is still at the last nightly ($GITHUB_SHA): nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          VERSION="$BASE-nightly.$(date -u +%Y%m%d)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "nightly $VERSION from $GITHUB_SHA (previous: ${PREVIOUS:-none})"

  ci:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  package:
    needs: [changes, ci]
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SQAIL_PACKAGE_VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh
      - name: Windows zip
        # No MSI: its product version must be numeric, so a nightly MSI would
        # carry the last release's version and confuse upgrades.
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  provenance:
    # Same as release.yml: SHA256SUMS, CycloneDX SBOMs and a build provenance
    # attestation per file (nightlies are only built from main).
    needs: [changes, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: nightly-*
          merge-multiple: true
      - name: SBOMs
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all
          for c in sqail-ui sqail-service; do
            mv "crates/$c/$c.cdx.json" "dist/sqail-$VERSION-$c.cdx.json"
          done
      - name: SHA256SUMS
        run: |
          cd dist
          shopt -s nullglob
          subjects=(*.tar.gz *.zip *.msi *.cdx.json)
          sha256sum -- "${subjects[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # nightly-*, so the prerelease and the server get it as well.
          name: nightly-provenance
          path: |
            dist/SHA256SUMS
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [changes, package, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: nightly-*
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
        run: |
          {
            echo "Automated build of \`main\` at $GITHUB_SHA ($(date -u +%Y-%m-%d))."
            echo "Not a stable release: it passed the full test suite, but nobody has tried it yet."
            echo
            if [[ -n "$PREVIOUS" && "$PREVIOUS" != "$GITHUB_SHA" ]]; then
              echo "Changes since the previous nightly: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_SHA"
              echo
            fi
            echo "## Unreleased"
            awk '/^## / { p = ($2 == "Unreleased"); next } p' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Replace the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          # The `nightly` tag moves to this commit (only v* tags are protected).
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --title "sqail nightly $VERSION" \
            --notes-file notes.md \
            --prerelease --latest=false

  deploy-binaries:
    needs: [changes, package, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: upload
          pattern: nightly-*
          merge-multiple: true
      - name: Write nightly.json
        # Same shape as current.json: `files` plus a `sha256` map.
        run: |
          cd upload
          files=(*)
          jq -n \
            --arg version "${{ needs.changes.outputs.version }}" \
            --arg commit "$GITHUB_SHA" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --rawfile sums SHA256SUMS \
            '{version: $version, commit: $commit, date: $date, files: $ARGS.positional,
              sha256: ($sums | split("\n") | map(select(length > 0)
                | capture("^(?<hash>[0-9a-f]{64}) [ *](?<name>.+)$")
                | {key: .name, value: .hash}) | from_entries)}' \
            --args "${files[@]}" > nightly.json
          cat nightly.json
      - name: Upload to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: "upload/*"
          # Emptied first, so only the latest nightly is kept.
          target: /opt/sqail-releases/nightly
          rm: true
          strip_components: 1
