name: portal

# Builds the sqail.io image (sqail.portal/, plus CHANGELOG.md from the root)
# and rolls it out on the k3s host. The download list is not baked in: the
# page reads /releases/current.json, which release.yml uploads with the files.
on:
  push:
    branches: [main]
    paths: ["sqail.portal/**", "k8s/portal/**", ".github/workflows/portal.yml"]
  workflow_call:
    inputs:
      version:
        description: "Release version, added as an image tag"
        type: string
        required: false
    secrets:
      ACR_USERNAME: { required: false }
      ACR_PASSWORD: { required: false }
      VPS_HOST: { required: false }
      VPS_USER: { required: false }
      VPS_SSH_KEY: { required: false }
      VPS_SSH_FINGERPRINT: { required: false }
  workflow_dispatch:

env:
  REGISTRY: beecodersregistry.azurecr.io
  IMAGE_NAME: sqail-portal

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to ACR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push portal image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sqail.portal/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version || github.sha }}

      - name: Deploy to k3s
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -e
            # A plain kubectl may be installed but unable to read the k3s
            # kubeconfig (root-only by default), so use it only if it can
            # reach the cluster; otherwise go through k3s with sudo.
            if command -v kubectl >/dev/null 2>&1 && kubectl -n sqail get deployment sqail-portal >/dev/null 2>&1; then
              KUBECTL="kubectl"
            else
              KUBECTL="sudo -n k3s kubectl"
            fi
            $KUBECTL -n sqail rollout restart deployment sqail-portal
            $KUBECTL -n sqail rollout status deployment sqail-portal --timeout=120s
