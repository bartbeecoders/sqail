name: release

# Tag v<version> (matching `version` in Cargo.toml) to release:
#   ci.yml checks → Linux tarball + Windows zip/MSI + pinned Arch PKGBUILD
#   → SBOMs, SHA256SUMS and build provenance attestations → GitHub release,
#   upload to the download server (+ current.json) → portal redeploy.
# Daily builds of main are nightly.yml's job; this is for stable versions.
# "Run workflow" (workflow_dispatch) only builds the packages (+ SBOMs and
# SHA256SUMS, but no attestations) and attaches them to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag is on main
        # main only takes merged pull requests whose checks passed, so a
        # release tag must point at a commit that went through that.
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - id: v
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
          PKGVER=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [[ "$PKGVER" != "$VERSION" ]]; then
            echo "::error::packaging/arch/PKGBUILD pkgver $PKGVER does not match Cargo.toml version $VERSION"
            exit 1
          fi

  package:
    needs: [ci, version]
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh
      - name: Windows zip + MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WiX 5: v6+ requires accepting the OSMF EULA.
          dotnet tool install --global wix --version 5.0.2
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqail-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  arch:
    # Checks that the PKGBUILD downloads, extracts and prepares the tag's
    # tarball, and pins the tarball's checksum in the copy attached to the
    # release (the PKGBUILD in the repository cannot know it in advance).
    if: github.ref_type == 'tag'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pin the checksum and run makepkg up to prepare()
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed rust clang cmake
          useradd -m builder
          mkdir -p /tmp/arch out
          cp packaging/arch/PKGBUILD /tmp/arch/
          chown -R builder /tmp/arch
          source /tmp/arch/PKGBUILD
          SUM=$(curl -fsSL "$url/archive/v$pkgver.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=('SKIP')/sha256sums=('$SUM')/" /tmp/arch/PKGBUILD
          grep -q "^sha256sums=('$SUM')" /tmp/arch/PKGBUILD
          (cd /tmp/arch && su builder -c "makepkg --nobuild --nodeps")
          cp /tmp/arch/PKGBUILD out/PKGBUILD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-pkgbuild
          path: out/PKGBUILD
          if-no-files-found: error

  provenance:
    # One SHA256SUMS over everything the release ships, a CycloneDX SBOM for
    # each of the two binaries' crates, and, for tags, a signed build
    # provenance attestation per file (`gh attestation verify`). Only tags
    # are attested, so an attestation always means "built from a v* tag".
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: sqail-*
          merge-multiple: true
      - name: SBOMs
        run: |
          # --target all: one SBOM covers the Linux and the Windows build.
          cargo cyclonedx --format json --spec-version 1.5 --target all
          for c in sqail-ui sqail-service; do
            mv "crates/$c/$c.cdx.json" "dist/sqail-$VERSION-$c.cdx.json"
          done
      - name: SHA256SUMS
        run: |
          cd dist
          shopt -s nullglob
          subjects=(*.tar.gz *.zip *.msi *.cdx.json)
          sha256sum -- "${subjects[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # sqail-*, so deploy-binaries uploads it to the server as well.
          name: sqail-provenance
          path: |
            dist/SHA256SUMS
            dist/*.cdx.json
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: [version, package, arch, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.version.outputs.version }}" \
            '/^## / { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## ${{ needs.version.outputs.version }}' section"
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: sqail ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true

  deploy-binaries:
    if: github.ref_type == 'tag'
    needs: [version, package, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: upload
          pattern: sqail-*
          merge-multiple: true
      - name: Write current.json for the portal
        # `files` lists every file name; `sha256` maps each file in
        # SHA256SUMS to its hash, so a download from the server can be
        # checked against the GitHub release.
        run: |
          cd upload
          files=(*)
          jq -n \
            --arg version "${{ needs.version.outputs.version }}" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --rawfile sums SHA256SUMS \
            '{version: $version, date: $date, files: $ARGS.positional,
              sha256: ($sums | split("\n") | map(select(length > 0)
                | capture("^(?<hash>[0-9a-f]{64}) [ *](?<name>.+)$")
                | {key: .name, value: .hash}) | from_entries)}' \
            --args "${files[@]}" > current.json
          cat current.json
      - name: Upload to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: "upload/*"
          target: /opt/sqail-releases
          strip_components: 1

  deploy-portal:
    # Rebuilt so the changelog on sqail.io includes this release.
    if: github.ref_type == 'tag'
    needs: [version, deploy-binaries]
    uses: ./.github/workflows/portal.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # Only what the portal job needs. Once these live in the `production`
    # environment, the portal job reads them from there instead.
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
