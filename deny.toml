# cargo-deny policy (run by scripts/check.sh). https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Every exception needs a reason and should be revisited on upgrades.
# (cargo-audit additionally ignores RUSTSEC-2026-0097, see .cargo/audit.toml:
# rand 0.7 via tiberius' Windows-only `winauth`; not reachable from sqail.)
ignore = [
    # zvariant, zvariant_derive and zbus_names are flagged unmaintained with no
    # successor yet. They come in through keyring → secret-service → zbus, the
    # Linux Secret Service backend for the UI's API token. Revisit when zbus
    # moves off them or keyring offers another D-Bus backend.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via keyring/zbus, no successor yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via keyring/zbus, no successor yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via keyring/zbus, no successor yet" },
]

[licenses]
# Permissive licences only (the app ships as a single binary).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
